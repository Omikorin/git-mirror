name: 'Git Mirror Repo'
description: 'Mirror a public or private repository. Compatible with LFS.'
author: 'Omikorin'
branding:
  icon: 'git-branch'
  color: 'purple'

inputs:
  target_repo:
    description: 'Target repository URL in SSH or HTTPS format'
    required: true
  ssh_private_key:
    description: 'SSH private key used for connection with target repository'
    required: false
  git_username:
    description: 'Username for the target repository [HTTPS only]'
    required: false
  git_token:
    description: 'Personal Access Token for the target repository [HTTPS only]'
    required: false
  ssh_known_hosts:
    description: 'The SSH known_hosts file contents'
    required: false
  ssh_strict_host_key_checking:
    description: 'Set strict SSH host key verification (true by default)'
    required: false
    default: 'true'
  disable_force_push:
    description: 'Push only the workflow branch without force, leaving other target branches untouched (tags are still force-pushed)'
    required: false
    default: 'false'
  branch:
    description: 'Branch to push in safe mode; defaults to the branch that triggered the workflow'
    required: false
  dry_run:
    description: 'Test the push without actually sending data'
    required: false
    default: 'false'

runs:
  using: 'docker'
  image: 'Dockerfile'
